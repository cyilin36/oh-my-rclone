name: Release

# 打上 v* 标签时自动触发创建 GitHub Release。
#   - 稳定版（如 v1.2.3）            -> latest 正式版
#   - 预览版（标签含 -，如 v1.2.3-beta.1 / v1.2.3-rc1 / v1.0.0-beta1）-> pre-release
# 源码附件（Source code zip / tar.gz）由 GitHub 自动附加，无需自行打包。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      # 解析标签，判断是稳定版还是预览版
      - name: Parse tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # 只要版本号里含 "-" 就算预览版：v1.2.3-beta.1 / v1.2.3-rc1 / v1.0.0-beta1 都是
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE="true"
            MAKE_LATEST="false"
          else
            PRERELEASE="false"    # v1.2.3 ... 稳定版
            MAKE_LATEST="true"
          fi
          echo "tag=${TAG}"                 >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}"         >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}"   >> "${GITHUB_OUTPUT}"
          echo "make_latest=${MAKE_LATEST}" >> "${GITHUB_OUTPUT}"

      # 幂等：若同名 release 已存在（如重跑），先删除再重建，避免 gh 报 already exists
      - name: Delete existing release (idempotent)
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "检测到已存在 release [$TAG]，删除后重建"
            gh release delete "$TAG" --yes
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}

      # 用 GitHub 官方 gh CLI 创建 Release（runner 预装，无 Node20 依赖）
      # 注意：--latest 与显式 tag 参数在某些 gh 版本冲突，这里显式分开处理
      - name: Create GitHub Release
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release create "$TAG" --title "$TAG" --generate-notes --prerelease --latest=false
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --latest
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
