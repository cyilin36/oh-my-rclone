name: Release

# 打上 v* 标签时自动触发：把发布所需文件打包成附件并发布到 GitHub Releases。
#   - 稳定版（如 v1.2.3）            -> 发布为 latest 正式版
#   - 预览版（标签含 -，如 v1.2.3-beta.1 / v1.2.3-rc1 / v1.0.0-beta1）-> 发布为 pre-release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build assets & create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 解析标签，判断是稳定版还是预览版
      - name: Parse tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # 只要版本号里含 "-" 就算预览版：v1.2.3-beta.1 / v1.2.3-rc1 / v1.0.0-beta1 都是
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE="true"
            MAKE_LATEST="false"
          else
            PRERELEASE="false"    # v1.2.3 ... 稳定版
            MAKE_LATEST="true"
          fi
          echo "tag=${TAG}"                 >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}"         >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}"   >> "${GITHUB_OUTPUT}"
          echo "make_latest=${MAKE_LATEST}" >> "${GITHUB_OUTPUT}"

      # 打包发布所需文件（不含 .env / docker-compose.yml / conf/config.toml 等真实配置）
      - name: Package release assets
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE="oh-my-rclone-${VERSION}"
          mkdir -p "dist/${ARCHIVE}/scripts" "dist/${ARCHIVE}/conf"
          cp Dockerfile docker-compose.yml.example .env.example README.md .gitignore "dist/${ARCHIVE}/"
          cp scripts/*.sh scripts/*.py "dist/${ARCHIVE}/scripts/"
          cp conf/config.toml.example "dist/${ARCHIVE}/conf/"
          (cd dist && tar -czf "${ARCHIVE}.tar.gz" "${ARCHIVE}")
          (cd dist && zip -qr "${ARCHIVE}.zip" "${ARCHIVE}")
          ls -lh dist

      # 创建/更新 GitHub Release，并上传附件
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: ${{ steps.version.outputs.make_latest }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/oh-my-rclone-${{ steps.version.outputs.version }}.tar.gz
            dist/oh-my-rclone-${{ steps.version.outputs.version }}.zip
