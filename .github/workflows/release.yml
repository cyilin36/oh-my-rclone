name: Release

# 打上 v* 标签时自动触发创建 GitHub Release。
#   - 稳定版（如 v1.2.3）            -> latest 正式版
#   - 预览版（标签含 -，如 v1.2.3-beta.1 / v1.2.3-rc1 / v1.0.0-beta1）-> pre-release
# 源码附件（Source code zip / tar.gz）由 GitHub 自动附加，无需自行打包。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      # 解析标签，判断是稳定版还是预览版
      - name: Parse tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # 只要版本号里含 "-" 就算预览版：v1.2.3-beta.1 / v1.2.3-rc1 / v1.0.0-beta1 都是
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE="true"
            MAKE_LATEST="false"
          else
            PRERELEASE="false"    # v1.2.3 ... 稳定版
            MAKE_LATEST="true"
          fi
          echo "tag=${TAG}"                 >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}"         >> "${GITHUB_OUTPUT}"
          echo "prerelease=${PRERELEASE}"   >> "${GITHUB_OUTPUT}"
          echo "make_latest=${MAKE_LATEST}" >> "${GITHUB_OUTPUT}"

      # 官方推荐：softprops/action-gh-release@v2 创建 Release（v1.0.0 已用此成功过）
      # 幂等：同名 release 已存在时自动跳过（update_release_body 处理）
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            ## oh-my-rclone ${{ steps.version.outputs.version }}

            基于 rclone 的单向同步备份 Docker 工具。
            详见 [README.md](https://github.com/cyilin36/oh-my-rclone/blob/main/README.md)
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: ${{ steps.version.outputs.make_latest }}
          fail_on_unmatched_files: true
