name: Docker Image

# 打上 v* 标签时自动触发：构建多架构镜像并推送到 Docker Hub。
#   - 稳定版（如 v1.2.3）            -> 推送 latest + 版本号标签
#   - 预览版（标签含 -，如 v1.2.3-beta.1 / v1.2.3-rc1 / v1.0.0-beta1）-> 推送 preview + 版本号标签
#
# 使用前需在仓库 Settings -> Secrets and variables -> Actions 中配置：
#   DOCKERHUB_USERNAME   Docker Hub 用户名
#   DOCKERHUB_TOKEN      Docker Hub Access Token（需有 push 权限）
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  # 与 docker-compose.yml 中 image: cyilin/oh-my-rclone:latest 保持一致
  IMAGE_NAME: cyilin/oh-my-rclone

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=preview,enable=${{ contains(github.ref_name, '-') }}

      # 多架构镜像：AMD64 + ARM64
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
