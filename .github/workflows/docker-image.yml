name: Docker Image

# 打上 v* 标签时自动触发：构建多架构镜像并推送到 GitHub GHCR（ghcr.io）。
#   - 稳定版（如 v1.2.3）            -> 推送 latest + 版本号标签
#   - 预览版（标签含 -，如 v1.2.3-beta.1 / v1.2.3-rc1 / v1.0.0-beta1）-> 推送 preview + 版本号标签
#
# 说明：
#   - 使用 GitHub 自带的 GITHUB_TOKEN 推送到 GHCR，无需额外配置 Docker Hub secrets。
#   - 首次推送后，请到仓库 Packages 页面把该镜像设为 Public（或按需设置权限）。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write   # 推送到 GHCR 需要 packages 写权限

env:
  # 与 docker-compose.yml 中 image: ghcr.io/cyilin36/oh-my-rclone:latest 保持一致
  IMAGE_NAME: ghcr.io/cyilin36/oh-my-rclone

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=semver,pattern={{major}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=preview,enable=${{ contains(github.ref_name, '-') }}

      # 多架构镜像：AMD64 + ARM64
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
